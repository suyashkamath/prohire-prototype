<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interview Review</title>
  <link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body>
<div class="wrap">
  <div class="between">
    <div><h1 id="title">Interview</h1><div id="meta" class="small muted"></div></div>
    <a href="/#review">← Settings</a>
  </div>

  <!-- the report, built from the candidate's answers -->
  <section class="card">
    <div class="between">
      <h2>Interview report</h2>
      <div class="row"><span id="reportMsg" class="small dim"></span><button id="makeReport">Generate report</button></div>
    </div>
    <div id="report" class="small muted">No report yet.</div>
  </section>

  <div class="cols">
    <section class="card"><h2>Conversation</h2><div id="turns" class="transcript" style="max-height:none"></div></section>
    <div style="display:flex;flex-direction:column;gap:16px">
      <section class="card"><h2>Recording</h2><div id="recording" class="small muted">No recording.</div></section>
      <section class="card"><h2>Events</h2><div id="events" class="small muted">None.</div></section>
      <section class="card"><h2>Settings used</h2><div id="plan" class="small"></div></section>
    </div>
  </div>
</div>
<script src="/static/session.js?v=5"></script>
</body>
</html>
